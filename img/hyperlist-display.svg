<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="hl-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9ece6a"/>
      <stop offset="100%" style="stop-color:#bd93f9"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes reveal { 0%,15% { opacity: 0; } 45%,100% { opacity: 1; } }
    .l1 { animation: reveal 3s ease-out infinite; animation-delay: 0s; }
    .l2 { animation: reveal 3s ease-out infinite; animation-delay: 0.25s; }
    .l3 { animation: reveal 3s ease-out infinite; animation-delay: 0.5s; }
    .l4 { animation: reveal 3s ease-out infinite; animation-delay: 0.75s; }
    .l5 { animation: reveal 3s ease-out infinite; animation-delay: 1.0s; }
    .l6 { animation: reveal 3s ease-out infinite; animation-delay: 1.25s; }
    .l7 { animation: reveal 3s ease-out infinite; animation-delay: 1.5s; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#hl-grad)" stroke-width="3"/>

  <!-- Markdown in, on the left: flat prose lines -->
  <g opacity="0.35">
    <rect x="34" y="64" width="42" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="74" width="50" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="84" width="38" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="94" width="46" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="104" width="30" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="114" width="48" height="3" rx="1.5" fill="#565f89"/>
    <rect x="34" y="124" width="40" height="3" rx="1.5" fill="#565f89"/>
    <text x="55" y="140" font-family="monospace" font-size="6" fill="#565f89" text-anchor="middle">markdown</text>
  </g>

  <!-- The hook, the arrow between -->
  <path d="M 92 94 L 108 94" stroke="#7aa2f7" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 104 90 L 109 94 L 104 98" stroke="#7aa2f7" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- HyperList out, on the right: a tab-indented tree, one level per tab -->
  <g font-family="monospace" font-size="7">
    <text class="l1" x="118" y="67"  fill="#9ece6a" font-weight="bold">1 </text>
    <rect class="l1" x="128" y="63" width="62" height="3" rx="1.5" fill="#9ece6a"/>
    <text class="l2" x="126" y="77"  fill="#7aa2f7">1.1 </text>
    <rect class="l2" x="144" y="73" width="50" height="3" rx="1.5" fill="#7aa2f7"/>
    <text class="l3" x="134" y="87"  fill="#bd93f9">1.1.1 </text>
    <rect class="l3" x="160" y="83" width="40" height="3" rx="1.5" fill="#bd93f9"/>
    <text class="l4" x="126" y="97"  fill="#7aa2f7">1.2 </text>
    <rect class="l4" x="144" y="93" width="44" height="3" rx="1.5" fill="#7aa2f7"/>
    <text class="l5" x="118" y="107" fill="#9ece6a" font-weight="bold">2 </text>
    <rect class="l5" x="128" y="103" width="56" height="3" rx="1.5" fill="#9ece6a"/>
    <text class="l6" x="126" y="117" fill="#7aa2f7">2.1 </text>
    <rect class="l6" x="144" y="113" width="48" height="3" rx="1.5" fill="#7aa2f7"/>
    <text class="l7" x="134" y="127" fill="#bd93f9">2.1.1 </text>
    <rect class="l7" x="160" y="123" width="36" height="3" rx="1.5" fill="#bd93f9"/>
    <text x="160" y="140" font-size="6" fill="#565f89" text-anchor="middle">HyperList</text>
  </g>

  <!-- Annotations -->
  <text x="46" y="160" font-family="monospace" font-size="6" fill="#7aa2f7" opacity="0.3">MessageDisplay</text>
  <text x="178" y="160" font-family="monospace" font-size="6" fill="#7aa2f7" opacity="0.3">syscall</text>

  <!-- Wordmark -->
  <text x="128" y="202" font-family="monospace" font-size="22" font-weight="bold"
        fill="url(#hl-grad)" text-anchor="middle" letter-spacing="2">hyperlist</text>
  <text x="128" y="220" font-family="monospace" font-size="7.5" fill="#565f89" text-anchor="middle">answers as HyperList</text>
</svg>
